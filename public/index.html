<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>모바일 마크다운 에디터 (HYK-304)</title>
    <style>
      :root {
        --color-bg: #fafaf8;
        --color-bg-elevated: #ffffff;
        --color-text-primary: #1a1a1a;
        --color-text-muted: #6b6b6b;
        --color-accent: #3b6fe0;
        --color-border: #ececea;
        --font-family: system-ui, -apple-system, "Pretendard", sans-serif;
        --font-size-body: 17px;
        --line-height-body: 1.6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text-primary);
        font-family: var(--font-family);
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--color-text-muted);
        margin: 0 0 12px;
      }
      [hidden] {
        display: none !important;
      }
      /* PRD §5b "최초 실행 1회 고지" / §8 보존 "조용한 고지"(coder-task.md
         §1): 모달이 아니라 입력을 막지 않는 작은 안내다 -- 화면 전환
         (list-screen/editor-screen hidden 토글)과 무관하게 body 바로
         아래 평범한 흐름(in-flow) 요소로 둬서 두 화면 어디서든(또는
         화면이 바뀌어도) 겹침·오버레이 없이 보인다. 닫기 전까지는 다시
         열어도 그대로 보인다(제품 결정, 결과 파일 §선택 근거). */
      #first-run-notice {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 16px;
        background: var(--color-bg-elevated);
        border-bottom: 1px solid var(--color-border);
        color: var(--color-text-muted);
        font-size: 13px;
      }
      #first-run-notice-close-button {
        flex: none;
        background: none;
        border: none;
        color: var(--color-text-muted);
        font: inherit;
        min-height: 44px;
        min-width: 44px;
        padding: 0;
        cursor: pointer;
      }
      #list-screen .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      #list-screen .topbar h1 {
        font-size: 22px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0;
      }
      #list-root .memo-card {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 8px;
        font: inherit;
        color: inherit;
        cursor: pointer;
        /* 검토 1R P1-1 실측: touch-action 선언이 없으면(auto) 가로
           스와이프를 브라우저가 팬 제스처로 가져가 pointercancel 을
           보내고 pointerup 이 오지 않아 삭제가 한 번도 안 불린다.
           pan-y 는 세로 스크롤은 그대로 브라우저가 처리하고 가로는
           페이지(여기서는 스와이프 삭제 리스너)가 받게 한다. */
        touch-action: pan-y;
      }
      #list-root .memo-card-title {
        font-size: var(--font-size-body);
        color: var(--color-text-primary);
        margin-bottom: 4px;
        overflow-wrap: anywhere;
      }
      #list-root .memo-card-meta {
        font-size: 13px;
        color: var(--color-text-muted);
      }
      #list-root .memo-list-empty {
        color: var(--color-text-muted);
        padding: 32px 8px;
        text-align: center;
      }
      #list-root .memo-list-error {
        display: block;
        width: 100%;
        background: none;
        border: none;
        color: #d14343;
        padding: 32px 8px;
        text-align: center;
        font: inherit;
        min-height: 44px;
        cursor: pointer;
      }
      /* PRD §5.5 삭제(+되돌리기) 토스트 -- "+"(new-memo-button, bottom 24px·
         높이 56px) 위에 겹치지 않게 그 위에 띄운다. notion-copy-toast 와
         같은 비토큰 다크 배경 선례(그 자리 주석 참고)를 그대로 따른다. */
      #list-delete-toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 92px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 8px;
        background: #2a2d33;
        color: #fafaf8;
        font-size: 14px;
      }
      #list-delete-undo-button {
        background: none;
        border: none;
        color: var(--color-accent);
        font: inherit;
        font-weight: 600;
        min-height: 44px;
        padding: 0 4px;
        cursor: pointer;
        flex: none;
      }
      /* HYK-304-delete-undo-ui-2(책임자 판정 §2): 저장 실패 표시를 목록 끝
         append 대신 이 토스트의 고정 영역에 그린다(검토 2R P2-1). 기존
         "메모를 삭제했어요" 텍스트(#list-delete-toast-text)가 있던 자리를
         저장 실패일 때 대신 차지한다 -- 되돌리기 토스트가 이미 떠 있던
         중(다른 메모) 실패가 나면 되돌리기 버튼은 그대로 두고(제품 결정)
         이 버튼이 옆에 함께 뜬다(한 영역에 버튼 둘, memo-list-mount.mjs
         의 syncToastVisibility 가 가시성을 가른다). */
      #list-save-error-button {
        flex: 1;
        min-width: 0;
        background: none;
        border: none;
        color: #ff9b9b;
        font: inherit;
        text-align: left;
        min-height: 44px;
        padding: 0;
        cursor: pointer;
      }
      #new-memo-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 56px;
        height: 56px;
        min-height: 44px;
        border-radius: 28px;
        background: var(--color-accent);
        color: #ffffff;
        border: none;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
      }
      #editor-screen .topbar {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
      }
      #back-to-list-button {
        background: none;
        border: none;
        color: var(--color-text-muted);
        font-size: 15px;
        min-height: 44px;
        padding: 0 8px 0 0;
        cursor: pointer;
      }
      #editor-root {
        min-height: 40vh;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
        caret-color: var(--color-accent);
        outline: none;
      }
      #editor-root:empty::before {
        content: "오늘 뭐 적어볼까요?";
        color: var(--color-text-muted);
      }
      #editor-root h1,
      #editor-root h2,
      #editor-root h3 {
        margin: 0.6em 0 0.3em;
      }
      #editor-root h1 {
        font-size: 1.6em;
      }
      #editor-root h2 {
        font-size: 1.35em;
      }
      #editor-root h3 {
        font-size: 1.15em;
      }
      #editor-root ul {
        padding-left: 1.4em;
      }
      #editor-root li[aria-checked] {
        list-style: none;
        position: relative;
      }
      /* 체크칸 글리프. width 는 px 로 고정해야 한다 -- @lexical/list 의 탭 판정이
         getComputedStyle(li, '::before').width 를 읽는데, 인라인 ::before 는 그 값이
         'auto' 라 NaN 이 되어 탭이 전부 빗나간다(HYK-304-checkbox-tap-toggle-1 실측). */
      #editor-root li[aria-checked]::before {
        content: "\2610";
        display: inline-block;
        width: 1.2em;
        margin-right: 0.2em;
        color: var(--color-text-muted);
      }
      /* 탭 덮개. 글리프 밖으로 뻗는 투명 덮개라 줄 높이·글자 위치는 그대로다.
         덮개를 누르면 탭 대상은 li 가 된다(가상 요소의 탭은 원소 자신으로 잡힌다).
         세로는 자기 줄의 첫 줄 상자(1lh)를 넘기지 않는다 -- 넘기면 이웃 줄 상자 위에 겹쳐
         이웃의 탭을 가로챈다(HYK-304-tap-overlay-geometry-1 실측: 44px 덮개는 위·아래로
         8.5px 씩 침범해 윗줄 탭이 아랫줄로 갔다). 줄 간격이 27.2px 라 44px 를 겹침 없이는
         지킬 수 없다 -- 실질 탭 높이는 줄 높이(27.2px)다(PRD 5b 와의 차이는 결과 파일에 적었다). */
      #editor-root li[aria-checked]::after {
        content: "";
        position: absolute;
        left: -1.4em;
        top: 0;
        width: 2.6em;
        height: 1lh;
      }
      #editor-root li[aria-checked="true"]::before {
        content: "\2611";
        color: var(--color-accent);
      }
      #editor-root li[aria-checked="true"] {
        color: var(--color-text-muted);
        text-decoration: line-through;
      }
      .editor-bold {
        font-weight: 700;
      }
      .editor-strikethrough {
        text-decoration: line-through;
      }
      /* 단축키바(PRD §5.3). 자판 위 엄지존 -- 화면 하단에 고정한다. 칩은 bg.elevated ·
         눌림 명도↓ · ≥44px 다. 바 아래로 본문이 가려지지 않게 에디터 화면에 여백을 준다. */
      #editor-screen {
        padding-bottom: 72px;
      }
      #shortcut-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        gap: 6px;
        padding: 8px 16px;
        background: var(--color-bg);
        border-top: 1px solid var(--color-border);
      }
      .shortcut-chip {
        flex: 1 1 0;
        min-width: 0;
        min-height: 44px;
        padding: 0 4px;
        border: 1px solid var(--color-border);
        border-radius: 8px;
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .shortcut-chip:active {
        background: var(--color-border);
      }
      .shortcut-chip:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
      #save-notice {
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #fff3e0;
        color: #7a4a00;
        font-size: 13px;
      }
      #notion-copy-button {
        margin-top: 12px;
        min-height: 44px;
        padding: 0 16px;
        border: none;
        border-radius: 8px;
        background: var(--color-accent);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      #notion-copy-button:hover:not(:disabled) {
        background: #2f5bc0;
      }
      #notion-copy-button:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
      #notion-copy-button:disabled {
        background: #c4c4c2;
        cursor: not-allowed;
      }
      #notion-copy-toast {
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #2a2d33;
        color: #fafaf8;
        font-size: 13px;
      }
      #notion-copy-toast[data-variant="error"] {
        background: #d14343;
      }
      .raw-section {
        margin-top: 16px;
      }
      #raw-panel {
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 13px;
        color: var(--color-text-muted);
        min-height: 2em;
      }
    </style>
  </head>
  <body>
    <div id="first-run-notice" hidden>
      <span id="first-run-notice-text"></span>
      <button
        id="first-run-notice-close-button"
        type="button"
        aria-label="닫기"
      >
        ✕
      </button>
    </div>
    <div id="list-screen" hidden>
      <div class="topbar">
        <h1>메모</h1>
      </div>
      <div id="list-root" class="list"></div>
      <div id="list-delete-toast" hidden>
        <span id="list-delete-toast-text">메모를 삭제했어요</span>
        <button id="list-delete-undo-button" type="button">되돌리기</button>
        <button id="list-save-error-button" type="button" hidden></button>
      </div>
      <button id="new-memo-button" type="button" aria-label="새 메모">+</button>
    </div>
    <div id="editor-screen" hidden>
      <div class="topbar">
        <button id="back-to-list-button" type="button">‹ 목록</button>
      </div>
      <div id="editor-root" contenteditable="true"></div>
      <div id="shortcut-bar" role="toolbar" aria-label="서식 단축키"></div>
      <div id="save-notice" hidden></div>
      <button id="notion-copy-button" type="button">노션 복사</button>
      <div id="notion-copy-toast" hidden></div>
      <div class="raw-section">
        <h1>지금 원문은 이것입니다(개발용 표시 -- 저장·복사 아님)</h1>
        <pre id="raw-panel"></pre>
      </div>
    </div>
    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
