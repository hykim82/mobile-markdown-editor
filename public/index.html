<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>에디터 -- 라이브 렌더링 (HYK-304)</title>
    <style>
      :root {
        --color-bg: #fafaf8;
        --color-bg-elevated: #ffffff;
        --color-text-primary: #1a1a1a;
        --color-text-muted: #6b6b6b;
        --color-accent: #3b6fe0;
        --color-border: #ececea;
        --font-family: system-ui, -apple-system, "Pretendard", sans-serif;
        --font-size-body: 17px;
        --line-height-body: 1.6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text-primary);
        font-family: var(--font-family);
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--color-text-muted);
        margin: 0 0 12px;
      }
      #editor-root {
        min-height: 40vh;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
        caret-color: var(--color-accent);
        outline: none;
      }
      #editor-root:empty::before {
        content: "오늘 뭐 적어볼까요?";
        color: var(--color-text-muted);
      }
      #editor-root h1,
      #editor-root h2,
      #editor-root h3 {
        margin: 0.6em 0 0.3em;
      }
      #editor-root h1 {
        font-size: 1.6em;
      }
      #editor-root h2 {
        font-size: 1.35em;
      }
      #editor-root h3 {
        font-size: 1.15em;
      }
      #editor-root ul {
        padding-left: 1.4em;
      }
      #editor-root li[aria-checked] {
        list-style: none;
      }
      #editor-root li[aria-checked]::before {
        content: "\2610";
        margin-right: 0.4em;
        color: var(--color-text-muted);
      }
      #editor-root li[aria-checked="true"]::before {
        content: "\2611";
        color: var(--color-accent);
      }
      #editor-root li[aria-checked="true"] {
        color: var(--color-text-muted);
        text-decoration: line-through;
      }
      .editor-bold {
        font-weight: 700;
      }
      .editor-strikethrough {
        text-decoration: line-through;
      }
      #save-notice {
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #fff3e0;
        color: #7a4a00;
        font-size: 13px;
      }
      #notion-copy-button {
        margin-top: 12px;
        min-height: 44px;
        padding: 0 16px;
        border: none;
        border-radius: 8px;
        background: var(--color-accent);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      #notion-copy-button:hover:not(:disabled) {
        background: #2f5bc0;
      }
      #notion-copy-button:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
      #notion-copy-button:disabled {
        background: #c4c4c2;
        cursor: not-allowed;
      }
      #notion-copy-toast {
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #2a2d33;
        color: #fafaf8;
        font-size: 13px;
      }
      #notion-copy-toast[data-variant="error"] {
        background: #d14343;
      }
      .raw-section {
        margin-top: 16px;
      }
      #raw-panel {
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 13px;
        color: var(--color-text-muted);
        min-height: 2em;
      }
    </style>
  </head>
  <body>
    <h1>에디터(라이브 렌더링)</h1>
    <div id="editor-root" contenteditable="true"></div>
    <div id="save-notice" hidden></div>
    <button id="notion-copy-button" type="button">노션 복사</button>
    <div id="notion-copy-toast" hidden></div>
    <div class="raw-section">
      <h1>지금 원문은 이것입니다(개발용 표시 -- 저장·복사 아님)</h1>
      <pre id="raw-panel"></pre>
    </div>
    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
