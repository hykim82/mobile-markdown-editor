<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>모바일 마크다운 에디터 (HYK-304)</title>
    <style>
      :root {
        /* PRD §3 "테마: 둘 다 + 시스템 자동(OS 변경 시 즉시 반영)". UA
           기본 요소(스크롤바·폼 컨트롤)도 다크를 알게 해 둔다(선택 근거:
           이것 없이는 브라우저가 라이트로 가정해 일부 UA 기본 위젯만
           불일치가 남을 수 있다). */
        color-scheme: light dark;
        /* 아래 11개는 spec/design-tokens.json 의 색 11개를 그대로 CSS
           변수로 옮긴 것(라이트 값, 값 반올림·대소문자 외 변형 0). 다크
           값은 바로 아래 @media (prefers-color-scheme: dark) 블록에서
           같은 11개 이름을 재선언한다 -- 매체질의는 브라우저가 스스로
           다시 그리므로 JS 는 쓰지 않는다(결과 파일 §2 근거). */
        --color-bg: #fafaf8;
        --color-bg-elevated: #ffffff;
        --color-text-primary: #1a1a1a;
        --color-text-muted: #6b6b6b;
        --color-accent: #3b6fe0;
        --color-border: #ececea;
        --color-state-error: #d14343;
        --color-state-success: #2e7d52;
        --color-accent-hover: #2f5bc0;
        --color-disabled: #c4c4c2;
        --color-focus-ring: #3b6fe0;
        /* 토스트(#list-delete-toast · #notion-copy-toast)는 "일부러 반대
           테마 값"을 쓰는 기존 선례(바로 아래 각 선택자 자리의 주석 참고)다
           -- 다크 미디어 블록에서 재선언하지 않아 OS 테마와 무관하게 항상
           같은 값으로 고정한다. 값은 토큰에서 그대로 가져왔다(새 값 0). */
        --color-toast-bg: #2a2d33; /* = color.border 의 dark 값(고정) */
        --color-toast-text: #fafaf8; /* = color.bg 의 light 값(고정) */
        --color-toast-error-bg: #d14343; /* = color.state.error 의 light 값(고정, 기존 렌더 값 보존) */
        /* HYK-304-system-theme-1-r2 §2 요구 2: color.state.error 의 dark 값
           (#e06c6c)은 고정 토스트 표면(--color-toast-bg #2a2d33) 위에서
           4.29(AA 4.5 미달, 1R 상신 후보 -- 검토 1R §6 P2-1)였다. 토큰
           안에 이 표면 위에서 4.5 이상인 "빨강"이 없어(새 색 값은 금지)
           color.text.primary 의 dark 값(#e6e6e3, 결과 파일 §2 대비표 ·
           11.04)으로 바꾼다. 색만으로는 더 이상 "오류"를 뜻하지 않으므로
           오류 의미는 아래 #list-save-error-button 의 밑줄(색이 아닌
           표시)이 대신 맡는다(문구는 memo-list-view.mjs 의 기존
           SAVE_ERROR_MESSAGE 그대로 -- "실패"라는 말 자체도 이미 문구로
           오류를 알린다, 바꾸지 않아 PRD §8 정책 문구와 충돌 없음). */
        --color-toast-error-text: #e6e6e3;
        /* accent/accent-hover 위에 얹는 흰 글자(FAB "+" · 노션 복사 버튼
           글자). 라이트는 accent 가 채도 있는 파란이라 흰 글자가 읽힌다
           (4.63, 결과 파일 §2-4 대비 계산 칸). ⚠️다크는 고정하지 않고
           바로 아래 @media (prefers-color-scheme: dark) 블록에서 같은
           이름을 color.bg 의 dark 값(#16181c)으로 재선언한다 -- 흰 글자
           그대로였다면 다크 accent(#5b8def)/accent-hover(#7aa2f2) 위에서
           3.23/2.54 로 AA 미달이었다(검토 1R §6 P2-2). color.bg.dark 로
           바꾸면 5.50/7.01 로 통과한다(HYK-304-system-theme-1-r2 §2 요구
           1, 값은 기존 토큰 그대로 -- 새 색 값 0). */
        --color-on-accent: #ffffff;
        --font-family: system-ui, -apple-system, "Pretendard", sans-serif;
        --font-size-body: 17px;
        --line-height-body: 1.6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg: #16181c;
          --color-bg-elevated: #1e2127;
          --color-text-primary: #e6e6e3;
          --color-text-muted: #9a9a97;
          --color-accent: #5b8def;
          --color-border: #2a2d33;
          --color-state-error: #e06c6c;
          --color-state-success: #5fb389;
          --color-accent-hover: #7aa2f2;
          --color-disabled: #3a3d44;
          --color-focus-ring: #7aa2f2;
          /* 위 :root 의 --color-on-accent 주석 참고 -- color.bg 의 dark
             값(토큰 값 그대로, 새 색 0)으로 재선언해 다크 accent 위 글자
             대비를 5.50/7.01 로 만든다(HYK-304-system-theme-1-r2 §2 요구 1). */
          --color-on-accent: #16181c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--color-bg);
        color: var(--color-text-primary);
        font-family: var(--font-family);
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        color: var(--color-text-muted);
        margin: 0 0 12px;
      }
      [hidden] {
        display: none !important;
      }
      /* PRD §5b "최초 실행 1회 고지" / §8 보존 "조용한 고지"(coder-task.md
         §1): 모달이 아니라 입력을 막지 않는 작은 안내다 -- 화면 전환
         (list-screen/editor-screen hidden 토글)과 무관하게 body 바로
         아래 평범한 흐름(in-flow) 요소로 둬서 두 화면 어디서든(또는
         화면이 바뀌어도) 겹침·오버레이 없이 보인다. ⚠️주석 정정(검토
         2R P3-1, HYK-304-notice-polish-1 §2-6ⓕ): "본 것" 기록은 닫기가
         아니라 표시 순간이다(책임자 결정 ⓓ) -- 그래서 닫지 않아도 다음
         실행부터는 뜨지 않는다. "다시 열어도 그대로 보인다"는 그 실행
         "안에서" 화면이 바뀌어도 유지된다는 뜻이고, 다음 실행을 가리키지
         않는다. */
      #first-run-notice {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 16px;
        background: var(--color-bg-elevated);
        border-bottom: 1px solid var(--color-border);
        color: var(--color-text-muted);
        font-size: 13px;
      }
      #first-run-notice-close-button {
        flex: none;
        background: none;
        border: none;
        color: var(--color-text-muted);
        font: inherit;
        min-height: 44px;
        min-width: 44px;
        padding: 0;
        cursor: pointer;
      }
      #list-screen .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      #list-screen .topbar h1 {
        font-size: 22px;
        font-weight: 600;
        color: var(--color-text-primary);
        margin: 0;
      }
      #list-root .memo-card {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 8px;
        font: inherit;
        color: inherit;
        cursor: pointer;
        /* 검토 1R P1-1 실측: touch-action 선언이 없으면(auto) 가로
           스와이프를 브라우저가 팬 제스처로 가져가 pointercancel 을
           보내고 pointerup 이 오지 않아 삭제가 한 번도 안 불린다.
           pan-y 는 세로 스크롤은 그대로 브라우저가 처리하고 가로는
           페이지(여기서는 스와이프 삭제 리스너)가 받게 한다. */
        touch-action: pan-y;
      }
      #list-root .memo-card-title {
        font-size: var(--font-size-body);
        color: var(--color-text-primary);
        margin-bottom: 4px;
        overflow-wrap: anywhere;
      }
      #list-root .memo-card-meta {
        font-size: 13px;
        color: var(--color-text-muted);
      }
      #list-root .memo-list-empty {
        color: var(--color-text-muted);
        padding: 32px 8px;
        text-align: center;
      }
      #list-root .memo-list-error {
        display: block;
        width: 100%;
        background: none;
        border: none;
        color: var(--color-state-error);
        padding: 32px 8px;
        text-align: center;
        font: inherit;
        min-height: 44px;
        cursor: pointer;
      }
      /* PRD §5.5 삭제(+되돌리기) 토스트 -- "+"(new-memo-button, bottom 24px·
         높이 56px) 위에 겹치지 않게 그 위에 띄운다. notion-copy-toast 와
         같은 비토큰 다크 배경 선례(그 자리 주석 참고)를 그대로 따른다. */
      #list-delete-toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 92px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--color-toast-bg);
        color: var(--color-toast-text);
        font-size: 14px;
      }
      #list-delete-undo-button {
        background: none;
        border: none;
        color: var(--color-accent);
        font: inherit;
        font-weight: 600;
        min-height: 44px;
        padding: 0 4px;
        cursor: pointer;
        flex: none;
      }
      /* HYK-304-delete-undo-ui-2(책임자 판정 §2): 저장 실패 표시를 목록 끝
         append 대신 이 토스트의 고정 영역에 그린다(검토 2R P2-1). 기존
         "메모를 삭제했어요" 텍스트(#list-delete-toast-text)가 있던 자리를
         저장 실패일 때 대신 차지한다 -- 되돌리기 토스트가 이미 떠 있던
         중(다른 메모) 실패가 나면 되돌리기 버튼은 그대로 두고(제품 결정)
         이 버튼이 옆에 함께 뜬다(한 영역에 버튼 둘, memo-list-mount.mjs
         의 syncToastVisibility 가 가시성을 가른다). */
      #list-save-error-button {
        flex: 1;
        min-width: 0;
        background: none;
        border: none;
        color: var(--color-toast-error-text);
        /* HYK-304-system-theme-1-r2 §2 요구 2: 글자 색이 더 이상 "빨강"이
           아니므로(위 --color-toast-error-text 주석) 오류/동작-가능 의미를
           색이 아닌 표시로 옮긴다 -- 밑줄(링크처럼 "누를 수 있다"는 뜻을
           더한다). 문구는 바꾸지 않는다(memo-list-view.mjs 의
           SAVE_ERROR_MESSAGE = "저장에 실패했어요. 다시 시도해 주세요" 가
           이미 "실패"라는 말로 오류를 알린다 -- PRD §8 정책 문구와
           충돌하지 않음, 원문 그대로 읽어 확인). */
        text-decoration: underline;
        font: inherit;
        text-align: left;
        min-height: 44px;
        padding: 0;
        cursor: pointer;
      }
      #new-memo-button {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 56px;
        height: 56px;
        min-height: 44px;
        border-radius: 28px;
        background: var(--color-accent);
        color: var(--color-on-accent);
        border: none;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
      }
      #editor-screen .topbar {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
      }
      #back-to-list-button {
        background: none;
        border: none;
        color: var(--color-text-muted);
        font-size: 15px;
        min-height: 44px;
        padding: 0 8px 0 0;
        cursor: pointer;
      }
      /* PRD §4 CUJ ④ "자동저장('저장됨')" · §6 "거슬림 없음"(coder-task.md
         HYK-304-saved-indicator-1 §2): 크롬 최소 -- 뒤로가기 버튼 옆에 조용한
         텍스트 한 줄. 색·크기는 기존에 같은 "조용한 텍스트" 용도로 이미 쓰는
         토큰 그대로(#first-run-notice·.memo-card-meta 와 같은
         color.text.muted/13px, 새 값 아님). 보임/숨김은 opacity 로 토글하고
         (hidden 속성처럼 display:none 을 쓰면 전환이 생기지 않는다),
         전환 시간은 design-tokens.json 의 motion.duration.base(200ms)
         그대로다(값 변형 금지). */
      #save-indicator {
        margin-left: auto;
        color: var(--color-text-muted);
        font-size: 13px;
        opacity: 0;
        transition: opacity 200ms;
      }
      #save-indicator.is-visible {
        opacity: 1;
      }
      #editor-root {
        min-height: 40vh;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
        font-size: var(--font-size-body);
        line-height: var(--line-height-body);
        caret-color: var(--color-accent);
        outline: none;
      }
      #editor-root:empty::before {
        content: "오늘 뭐 적어볼까요?";
        color: var(--color-text-muted);
      }
      #editor-root h1,
      #editor-root h2,
      #editor-root h3 {
        margin: 0.6em 0 0.3em;
      }
      #editor-root h1 {
        font-size: 1.6em;
      }
      #editor-root h2 {
        font-size: 1.35em;
      }
      #editor-root h3 {
        font-size: 1.15em;
      }
      #editor-root ul {
        padding-left: 1.4em;
      }
      #editor-root li[aria-checked] {
        list-style: none;
        position: relative;
      }
      /* 체크칸 글리프. width 는 px 로 고정해야 한다 -- @lexical/list 의 탭 판정이
         getComputedStyle(li, '::before').width 를 읽는데, 인라인 ::before 는 그 값이
         'auto' 라 NaN 이 되어 탭이 전부 빗나간다(HYK-304-checkbox-tap-toggle-1 실측). */
      #editor-root li[aria-checked]::before {
        content: "\2610";
        display: inline-block;
        width: 1.2em;
        margin-right: 0.2em;
        color: var(--color-text-muted);
      }
      /* 탭 덮개. 글리프 밖으로 뻗는 투명 덮개라 줄 높이·글자 위치는 그대로다.
         덮개를 누르면 탭 대상은 li 가 된다(가상 요소의 탭은 원소 자신으로 잡힌다).
         세로는 자기 줄의 첫 줄 상자(1lh)를 넘기지 않는다 -- 넘기면 이웃 줄 상자 위에 겹쳐
         이웃의 탭을 가로챈다(HYK-304-tap-overlay-geometry-1 실측: 44px 덮개는 위·아래로
         8.5px 씩 침범해 윗줄 탭이 아랫줄로 갔다). 줄 간격이 27.2px 라 44px 를 겹침 없이는
         지킬 수 없다 -- 실질 탭 높이는 줄 높이(27.2px)다(PRD 5b 와의 차이는 결과 파일에 적었다). */
      #editor-root li[aria-checked]::after {
        content: "";
        position: absolute;
        left: -1.4em;
        top: 0;
        width: 2.6em;
        height: 1lh;
      }
      #editor-root li[aria-checked="true"]::before {
        content: "\2611";
        color: var(--color-accent);
      }
      #editor-root li[aria-checked="true"] {
        color: var(--color-text-muted);
        text-decoration: line-through;
      }
      .editor-bold {
        font-weight: 700;
      }
      .editor-strikethrough {
        text-decoration: line-through;
      }
      /* 단축키바(PRD §5.3). 자판 위 엄지존 -- 화면 하단에 고정한다. 칩은 bg.elevated ·
         눌림 명도↓ · ≥44px 다. 바 아래로 본문이 가려지지 않게 에디터 화면에 여백을 준다. */
      #editor-screen {
        padding-bottom: 72px;
      }
      #shortcut-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        gap: 6px;
        padding: 8px 16px;
        background: var(--color-bg);
        border-top: 1px solid var(--color-border);
      }
      .shortcut-chip {
        flex: 1 1 0;
        min-width: 0;
        min-height: 44px;
        padding: 0 4px;
        border: 1px solid var(--color-border);
        border-radius: 8px;
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .shortcut-chip:active {
        background: var(--color-border);
      }
      .shortcut-chip:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
      /* HYK-304-system-theme-1 §2 요구 3(판정 판단 2 A): 토큰 이탈
         #fff3e0/#7a4a00 를 기존 토큰으로 맞춘다 -- 배경 color.bg.elevated
         + 글자 color.text.primary(이 알림도 다른 평범한 표면 요소와 같은
         "거슬림 없는" 카드로 보이게, PRD §1 톤). 경고 성격을 보여줄 전용
         토큰이 없어(디자인 토큰에 "warning" 계열 0) 왼쪽 선만 color.
         state.error 로 얇게 둬 눈에 띄는 정도를 유지한다(후보표 §2 판단
         2 A 제안을 그대로 적용). 셋 다 테마를 그대로 탄다(라이트/다크 값이
         있는 평범한 토큰이라 고정하지 않음). */
      #save-notice {
        margin-top: 8px;
        padding: 8px 12px 8px 9px;
        border-radius: 8px;
        border-left: 3px solid var(--color-state-error);
        background: var(--color-bg-elevated);
        color: var(--color-text-primary);
        font-size: 13px;
      }
      #notion-copy-button {
        margin-top: 12px;
        min-height: 44px;
        padding: 0 16px;
        border: none;
        border-radius: 8px;
        background: var(--color-accent);
        color: var(--color-on-accent);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      #notion-copy-button:hover:not(:disabled) {
        background: var(--color-accent-hover);
      }
      #notion-copy-button:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
      #notion-copy-button:disabled {
        background: var(--color-disabled);
        /* HYK-304-system-theme-1-r3 §2 요구 1: 2R 은 이 규칙에 color 를
           선언하지 않아 #notion-copy-button 의 흰 글자(--color-on-accent)가
           그대로 상속됐다 -- 라이트는 1.75(1R 부터 미달 유지)였지만 다크는
           --color-on-accent 가 2R 부터 어두운 값(#16181c)으로 바뀌면서
           10.88 → 1.63 으로 떨어져(결과 파일 §2 표) 비활성 배경(#3a3d44) 위
           거의 안 보였다(2R 이 만든 후퇴, 새 메모마다 보임). 기존 토큰
           --color-text-muted(새 값 0)로 바꿔 "비활성 = 흐리게" 관례를 따르고
           라이트 3.05 · 다크 3.85 로 복원한다(여전히 WCAG AA 4.5 미달이지만
           비활성 컨트롤은 1.4.3 예외 -- 아래 시험 PAIR_DEFS 참고). */
        color: var(--color-text-muted);
        cursor: not-allowed;
      }
      #notion-copy-toast {
        margin-top: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--color-toast-bg);
        color: var(--color-toast-text);
        font-size: 13px;
      }
      #notion-copy-toast[data-variant="error"] {
        background: var(--color-toast-error-bg);
      }
      .raw-section {
        margin-top: 16px;
      }
      #raw-panel {
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--color-bg-elevated);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 16px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 13px;
        color: var(--color-text-muted);
        min-height: 2em;
      }
    </style>
  </head>
  <body>
    <div id="first-run-notice" hidden>
      <span id="first-run-notice-text"></span>
      <button
        id="first-run-notice-close-button"
        type="button"
        aria-label="닫기"
      >
        ✕
      </button>
    </div>
    <div id="list-screen" hidden>
      <div class="topbar">
        <h1>메모</h1>
      </div>
      <div id="list-root" class="list"></div>
      <div id="list-delete-toast" hidden>
        <span id="list-delete-toast-text">메모를 삭제했어요</span>
        <button id="list-delete-undo-button" type="button">되돌리기</button>
        <button id="list-save-error-button" type="button" hidden></button>
      </div>
      <button id="new-memo-button" type="button" aria-label="새 메모">+</button>
    </div>
    <div id="editor-screen" hidden>
      <div class="topbar">
        <button id="back-to-list-button" type="button">‹ 목록</button>
        <span id="save-indicator" aria-hidden="true">저장됨</span>
      </div>
      <div id="editor-root" contenteditable="true"></div>
      <div id="shortcut-bar" role="toolbar" aria-label="서식 단축키"></div>
      <div id="save-notice" hidden></div>
      <button id="notion-copy-button" type="button">노션 복사</button>
      <div id="notion-copy-toast" hidden></div>
      <div class="raw-section">
        <h1>지금 원문은 이것입니다(개발용 표시 -- 저장·복사 아님)</h1>
        <pre id="raw-panel"></pre>
      </div>
    </div>
    <script type="module" src="/dist/app.js"></script>
  </body>
</html>
